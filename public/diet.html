<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Chart</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('..//public/img/dietbg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 100px auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        .diet-item {
            margin: 10px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Diet Chart</h1>
        <div id="diet-chart"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const stage = urlParams.get('stage');

        const dietChartData = {
            'Early': [
                { time: 'Breakfast', food: 'Oatmeal', quantity: '1 bowl', proteins: '5g' },
                { time: 'Lunch', food: 'Grilled Chicken', quantity: '150g', proteins: '31g' },
            ],
            'Mid': [
                { time: 'Breakfast', food: 'Scrambled Eggs', quantity: '2', proteins: '12g' },
                { time: 'Lunch', food: 'Salmon', quantity: '150g', proteins: '25g' },
            ],
            'Late': [
                { time: 'Breakfast', food: 'Protein Shake', quantity: '1 serving', proteins: '20g' },
                { time: 'Lunch', food: 'Steamed Vegetables', quantity: '1 cup', proteins: '4g' },
            ],
        };

        function displayDietChart(stage) {
            const chart = dietChartData[stage] || [];
            let output = '';

            chart.forEach(item => {
                output += `<div class="diet-item">${item.time}: ${item.food} (${item.quantity}, Proteins: ${item.proteins})</div>`;
            });

            if (!output) {
                output = 'No diet chart available for this stage.';
            }

            document.getElementById('diet-chart').innerHTML = output;
        }

        displayDietChart(stage);
    </script>
</body>
</html>
